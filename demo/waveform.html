<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Waveform | CoCreate</title>
		<link rel="stylesheet" href="index.css" />
		<style>
			canvas { display: block; width: 100%; margin: 24px 0; color: #4da85a; }
			[waveform-query] .listening { display: none; }
			[waveform-active="true"] .idle { display: none; }
			[waveform-active="true"] .listening { display: inline; }
		</style>
	</head>
	<body>
		<main id="page-wrapper">
			<h1>Waveform</h1>
			<p>Live waveform samples from the Web Audio analyser.</p>
			<button id="control" type="button"
				waveform-query="$document #wave" waveform-fft-size="2048"
				aria-label="Toggle waveform">
				<span class="idle">● Start</span>
				<span class="listening">■ Stop</span>
			</button>
			<canvas id="wave" width="960" height="240" role="img"
				aria-label="Live audio waveform"></canvas>
			<p id="status" role="status">Start to request microphone access.</p>
		</main>
		<script src="../dist/CoCreate-waveform.js"></script>
		<script>
			const control = document.querySelector('#control');
			const status = document.querySelector('#status');
			control.addEventListener('waveform-start', () => { status.textContent = 'Listening'; });
			control.addEventListener('waveform-end', () => { status.textContent = 'Stopped'; });
			control.addEventListener('waveform-error', event => {
				status.textContent = event.detail.error.message;
			});
		</script>
	</body>
</html>
